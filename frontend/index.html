<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymTracker - Praćenje Treninga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">GymTracker</a>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none" onclick="logout()">Odjava</button>
        </div>
    </nav>

    <div class="container">
        <!--Login / Registracija -->
        <div id="authSection" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <h3 class="text-center mb-3" id="authTitle">Prijava</h3>
                    
                    <form id="authForm" onsubmit="handleAuth(event)">
                        <div id="registerFields" class="d-none">
                            <div class="mb-3">
                                <label class="form-label">Ime</label>
                                <input type="text" id="firstName" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Prezime</label>
                                <input type="text" id="lastName" class="form-control">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email adresa</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Lozinka</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="authSubmitBtn">Prijavi se</button>
                    </form>

                    <div class="text-center mt-3">
                        <button class="btn btn-link btn-sm text-decoration-none" onclick="toggleAuthMode()" id="toggleAuthBtn">
                            Nemate nalog? Registrujte se
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard (Unos + Statistika) -->
        <div id="dashboardSection" class="d-none">
            <div class="row">
                <!--- unos treninga -->
                <div class="col-md-5 mb-4">
                    <div class="card shadow-sm p-4">
                        <h4 class="mb-3">Beleženje Treninga</h4>
                        <form id="workoutForm" onsubmit="saveWorkout(event)">
                            <div class="mb-3">
                                <label class="form-label">Vrsta vežbe</label>
                                <select id="exerciseType" class="form-select" required>
                                    <option value="11111111-1111-1111-1111-111111111111">Kardio</option>
                                    <option value="22222222-2222-2222-2222-222222222222">Trening snage</option>
                                    <option value="33333333-3333-3333-3333-333333333333">Fleksibilnost</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Datum i Vreme</label>
                                <input type="datetime-local" id="workoutDate" class="form-control" required>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">Trajanje (min)</label>
                                    <input type="number" id="duration" class="form-control" min="1" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">Kalorije (kcal)</label>
                                    <input type="number" id="calories" class="form-control" min="0" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">Težina (1-10)</label>
                                    <input type="number" id="intensity" class="form-control" min="1" max="10" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">Umor (1-10)</label>
                                    <input type="number" id="fatigue" class="form-control" min="1" max="10" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Beleške</label>
                                <textarea id="notes" class="form-control" rows="2"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Sačuvaj Trening</button>
                        </form>
                    </div>
                </div>

                <!-- Pregled napretka  -->
                <div class="col-md-7">
                    <div class="card shadow-sm p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4>Napredak po Nedeljama</h4>
                            <div class="d-flex gap-2">
                                <input type="number" id="filterYear" class="form-control form-control-sm" style="width: 90px;" value="2026">
                                <select id="filterMonth" class="form-select form-select-sm" style="width: 120px;" onchange="loadProgress()">
                                    <option value="1">Januar</option>
                                    <option value="2">Februar</option>
                                    <option value="3">Mart</option>
                                    <option value="4">April</option>
                                    <option value="5">Maj</option>
                                    <option value="6">Jun</option>
                                    <option value="7">Jul</option>
                                    <option value="8">Avgust</option>
                                    <option value="9" selected>Septembar</option>
                                    <option value="10">Oktobar</option>
                                    <option value="11">Novembar</option>
                                    <option value="12">Decembar</option>
                                </select>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Nedelja</th>
                                        <th>Br. Treninga</th>
                                        <th>Ukupno (min)</th>
                                        <th>Prosečna Težina</th>
                                        <th>Prosečan Umor</th>
                                    </tr>
                                </thead>
                                <tbody id="progressTableBody">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted">Izaberite mesec ili unestite treninge.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
